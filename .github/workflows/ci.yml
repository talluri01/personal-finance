name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install & verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check server.js

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server in background
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000 && break
            echo "Waiting for server... ($i)"
            sleep 1
          done

      - name: GET / returns HTML
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: GET /api/transactions returns JSON array
        run: |
          BODY=$(curl -s http://localhost:3000/api/transactions)
          echo "Response: $BODY"
          echo "$BODY" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); if(!Array.isArray(d)) process.exit(1)"

      - name: POST /api/transactions creates a transaction
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/transactions \
            -H "Content-Type: application/json" \
            -d '{"id":"ci-test-1","type":"expense","amount":10.00,"category":"Food","date":"2026-01-01","note":"CI test"}')
          echo "Status: $STATUS"
          [ "$STATUS" = "201" ]

      - name: DELETE /api/transactions/:id removes the transaction
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE http://localhost:3000/api/transactions/ci-test-1)
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ]

  open-pr:
    name: Open pull request
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    # Only run on branch pushes, not on PR events
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: ${{ github.ref_name }}
          body: |
            Automated PR from branch `${{ github.ref_name }}`.

            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}

            CI (build + smoke test) passed before this PR was opened.
          draft: false
